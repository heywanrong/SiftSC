<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">SiftSC benchmark headline</title>
  <desc id="desc">99.3 percent of prompts stay one-pass while retaining 98.7 percent of always self-consistency accuracy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#111a38"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <circle cx="1010" cy="80" r="150" fill="#4f46e5" opacity=".18" filter="url(#glow)"/>
  <circle cx="190" cy="470" r="170" fill="#0891b2" opacity=".14" filter="url(#glow)"/>
  <text x="600" y="76" text-anchor="middle" fill="#cbd5e1" font-family="Inter,ui-sans-serif,system-ui" font-size="22" letter-spacing="5">SMALL MODELS · SMARTER TEST-TIME COMPUTE</text>
  <text x="600" y="132" text-anchor="middle" fill="#ffffff" font-family="Inter,ui-sans-serif,system-ui" font-size="38" font-weight="700">Think once. Vote only when it helps.</text>
  <rect x="78" y="180" width="500" height="236" rx="24" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".45"/>
  <text x="328" y="235" text-anchor="middle" fill="#94a3b8" font-family="Inter,ui-sans-serif,system-ui" font-size="18" font-weight="600" letter-spacing="2">COMPUTE</text>
  <text x="328" y="326" text-anchor="middle" fill="url(#accent)" font-family="Inter,ui-sans-serif,system-ui" font-size="78" font-weight="800">99.3%</text>
  <text x="328" y="370" text-anchor="middle" fill="#f8fafc" font-family="Inter,ui-sans-serif,system-ui" font-size="24">of prompts stay one-pass</text>
  <rect x="622" y="180" width="500" height="236" rx="24" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".45"/>
  <text x="872" y="235" text-anchor="middle" fill="#94a3b8" font-family="Inter,ui-sans-serif,system-ui" font-size="18" font-weight="600" letter-spacing="2">QUALITY</text>
  <text x="872" y="326" text-anchor="middle" fill="url(#accent)" font-family="Inter,ui-sans-serif,system-ui" font-size="78" font-weight="800">98.7%</text>
  <text x="872" y="370" text-anchor="middle" fill="#f8fafc" font-family="Inter,ui-sans-serif,system-ui" font-size="24">of always-SC accuracy retained</text>
  <text x="600" y="468" text-anchor="middle" fill="#94a3b8" font-family="Inter,ui-sans-serif,system-ui" font-size="17">Qwen2.5-0.5B · MLX 4-bit · 400 pooled reasoning prompts</text>
</svg>
