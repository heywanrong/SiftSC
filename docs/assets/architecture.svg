<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-labelledby="title desc">
  <title id="title">SiftSC selective inference flow</title>
  <desc id="desc">A prompt runs one greedy pass. A tiny gate either returns it immediately or invokes four more traces and votes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1100" height="250" rx="22" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle">
    <g filter="url(#shadow)"><rect x="35" y="82" width="170" height="86" rx="16" fill="#fff"/><text x="120" y="117" font-size="18" font-weight="700" fill="#0f172a">Prompt</text><text x="120" y="145" font-size="14" fill="#475569">one question</text></g>
    <path d="M210 125 H270" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)"><rect x="280" y="62" width="210" height="126" rx="16" fill="#fff"/><text x="385" y="105" font-size="18" font-weight="700" fill="#0f172a">Greedy pass</text><text x="385" y="133" font-size="14" fill="#475569">answer + uncertainty</text><text x="385" y="160" font-size="13" font-weight="600" fill="#2563eb">cost = 1</text></g>
    <path d="M495 125 H555" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)"><path d="M665 52 L765 125 L665 198 L565 125 Z" fill="#f8fafc"/><text x="665" y="115" font-size="18" font-weight="700" fill="#0f172a">Tiny gate</text><text x="665" y="142" font-size="13" fill="#475569">worth voting?</text></g>
    <path d="M765 112 C820 80 835 66 873 66" stroke="#22c55e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="817" y="73" font-size="13" font-weight="700" fill="#86efac">NO</text>
    <g filter="url(#shadow)"><rect x="885" y="30" width="180" height="72" rx="16" fill="#dcfce7"/><text x="975" y="61" font-size="17" font-weight="700" fill="#14532d">Return greedy</text><text x="975" y="84" font-size="13" fill="#166534">save 4 passes</text></g>
    <path d="M765 138 C815 168 840 184 873 184" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="817" y="172" font-size="13" font-weight="700" fill="#fcd34d">YES</text>
    <g filter="url(#shadow)"><rect x="885" y="148" width="180" height="72" rx="16" fill="#fef3c7"/><text x="975" y="178" font-size="17" font-weight="700" fill="#78350f">+4 traces</text><text x="975" y="201" font-size="13" fill="#92400e">plurality vote</text></g>
  </g>
</svg>
