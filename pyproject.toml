[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "siftsc"
version = "0.3.0"
description = "Selective self-consistency for small local language models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Wanrong Yang" }]
keywords = ["llm", "self-consistency", "test-time-compute", "mlx", "reasoning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.31.3,<0.32; sys_platform == 'darwin'", "textual>=1.0"]
ui = ["textual>=1.0"]
calibrate = ["scikit-learn>=1.4"]
dev = [
  "build>=1.3",
  "textual>=1.0",
  "matplotlib>=3.9",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "scikit-learn>=1.4",
]

[project.scripts]
siftsc = "siftsc.cli:main"

[project.urls]
Homepage = "https://github.com/heywanrong/SiftSC"
Repository = "https://github.com/heywanrong/SiftSC"
Issues = "https://github.com/heywanrong/SiftSC/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/siftsc"]

[tool.hatch.build.targets.sdist]
include = ["src/siftsc", "tests", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["local_model: requires a local MLX model and Apple Silicon"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Chinese test questions legitimately use full-width punctuation.
allowed-confusables = ["，", "？", "：", "（", "）"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["siftsc"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["huggingface_hub.*", "mlx.*", "mlx_lm.*", "sklearn.*"]
ignore_missing_imports = true
